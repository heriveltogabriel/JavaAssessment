---
- name: Instalar Java Assessment por ambiente
  hosts: assessment_agents
  gather_facts: false
  become: false
  strategy: linear
  serial: "{{ assessment_batch_size | default(2) | int }}"
  any_errors_fatal: true
  tasks:
    - name: Validar modo de execução
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - (assessment_install_mode | default('auto')) in ['auto', 'reinstall']
          - (assessment_batch_size | default(2) | int) >= 1
          - (assessment_batch_size | default(2) | int) <= 2
        fail_msg: Use --syntax-check para validar. Use assessment_install_mode auto ou reinstall. Este playbook instala em lotes de 1 ou 2 hosts.

    - name: Consultar instalação, identidade e serviços sem exibir credenciais
      ansible.builtin.script:
        cmd: files/manage-agent.sh probe
        executable: /bin/sh
      become: true
      become_user: root
      become_method: sudo
      changed_when: false
      register: ja_state

    - name: Validar classificação local
      ansible.builtin.assert:
        that:
          - ja_state.stdout is search('JA_STATE=(ABSENT|HEALTHY|REPAIR|RESIDUE)')
        fail_msg: Estado local não reconhecido. Nenhum arquivo será removido.

    - name: Informar instalação existente preservada
      ansible.builtin.debug:
        msg: Agente íntegro e serviços ativos; instalação preservada. Atualizações e confirmação do contato continuam pelo dashboard.
      when: "'JA_STATE=HEALTHY' in ja_state.stdout and (assessment_install_mode | default('auto')) == 'auto'"

    - name: Instalar, recuperar ou reinstalar conforme o estado local
      when: "'JA_STATE=HEALTHY' not in ja_state.stdout or (assessment_install_mode | default('auto')) == 'reinstall'"
      block:
        - name: Validar variáveis de instalação sem exibir credenciais
          ansible.builtin.assert:
            that:
              - assessment_dashboard_url is match('^https://[A-Za-z0-9.\[\]:-]+/?$')
              - assessment_environment_id is match('^env-[A-Za-z0-9-]{1,90}$')
              - "'SUBSTITUA' not in assessment_environment_id"
              - assessment_install_token is match('^eia1_[a-f0-9]{64}$')
              - assessment_ca_file | length > 0
              - (assessment_java_path | default('')) is match('^(/[A-Za-z0-9_./+ -]+)?$')
            fail_msg: Preencha URL HTTPS, ID real do ambiente, credencial de instalação e caminho da CA.
          no_log: true

        - name: Validar formato da CA no controlador
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.file', assessment_ca_file) | length <= 65536
              - lookup('ansible.builtin.file', assessment_ca_file) is match('(?s)^(-----BEGIN CERTIFICATE-----\s+[A-Za-z0-9+/=\s]+-----END CERTIFICATE-----\s*)+$')
            fail_msg: Informe um arquivo PEM contendo somente certificados da CA do dashboard.

        - name: Criar área temporária privada no controlador
          ansible.builtin.tempfile:
            state: directory
            prefix: java-assessment-ansible-
          delegate_to: localhost
          become: false
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          register: ja_local

        - name: Gerar script wget privado por máquina
          ansible.builtin.template:
            src: templates/download-agent.sh.j2
            dest: "{{ ja_local.path }}/download.sh"
            mode: '0600'
          delegate_to: localhost
          become: false
          vars:
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          no_log: true
          diff: false

        - name: Baixar e verificar pacote como usuário SSH
          ansible.builtin.script:
            cmd: "{{ (ja_local.path ~ '/download.sh') | quote }}"
            executable: /bin/sh
          become: false
          register: ja_download
          no_log: true

        - name: Extrair somente o caminho temporário do resultado
          ansible.builtin.set_fact:
            ja_stages: "{{ ja_download.stdout | regex_findall('JAVA_ASSESSMENT_STAGE=(/tmp/java-assessment-ansible[.][A-Za-z0-9]+)') }}"
          no_log: true

        - name: Conferir caminho único do pacote verificado
          ansible.builtin.assert:
            that:
              - ja_stages | length == 1
            fail_msg: O download não devolveu um caminho temporário válido.

        - name: Guardar caminho temporário sem credencial
          ansible.builtin.set_fact:
            ja_stage: "{{ ja_stages[0] }}"

        - name: Instalar e configurar serviços com sudo
          ansible.builtin.script:
            cmd: >-
              files/manage-agent.sh apply {{ (assessment_install_mode | default('auto')) | quote }}
              {{ (ja_stage ~ '/package') | quote }} {{ (assessment_java_path | default('')) | quote }}
            executable: /bin/sh
          become: true
          become_user: root
          become_method: sudo
          register: ja_install
          no_log: true

        - name: Informar resultado sem expor o log privado
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: operação local concluída.
              {{ 'Serviços recuperados; versão e cadastro preservados.' if 'JA_RESULT=SERVICES_RECOVERED' in ja_install.stdout else 'Confira abaixo o backup da operação.' }}
              {{ ja_install.stdout | regex_findall('JA_BACKUP=(/opt/java-assessment-ansible[.][A-Za-z0-9]+/backup)') | join(', ') }}.
              Confira o contato e a coleta no dashboard. Em modo auto, o cadastro anterior é preservado.
      rescue:
        - name: Interromper lote com orientação de diagnóstico
          ansible.builtin.fail:
            msg: >-
              Falha em {{ inventory_hostname }}, etapa {{ ansible_failed_task.name }}.
              Credenciais e saída da instalação foram ocultadas.
              Para falha de instalação, consulte /opt/java-assessment-collector/logs/install.log na máquina.
              Diagnóstico: {{ (ja_install.stdout | default('')) | regex_findall('JA_ERROR=([A-Z_]+)') | join(', ') }}
              {{ (ja_install.stderr | default('')) | regex_findall('JA_ERROR=([A-Z_]+)') | join(', ') }}.
              Log privado: {{ (ja_install.stdout | default('')) | regex_findall('JA_LOG=(/opt/java-assessment-ansible[.][A-Za-z0-9]+/operation[.]log)') | join(', ') }}.
              A automação não força a remoção de operações pendentes ou arquivos desconhecidos.
      always:
        - name: Limpar áreas temporárias mesmo se a limpeza remota falhar
          block:
            - name: Remover apenas o download temporário desta execução
              ansible.builtin.raw: |
                set -eu
                p={{ ja_stage | quote }}
                test -d "$p" && test ! -L "$p"
                test "$(stat -c %u "$p")" = "$(id -u)"
                rm -rf -- "$p"
              args:
                executable: /bin/sh
              become: false
              when: ja_stage is defined
              changed_when: false
          always:
            - name: Remover script com credencial do controlador
              ansible.builtin.file:
                path: "{{ ja_local.path }}"
                state: absent
              delegate_to: localhost
              become: false
              vars:
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
              when: ja_local is defined and ja_local.path is defined
              no_log: true
              diff: false
              changed_when: false
